; Configuración básica de PHP para Desarrollo (OpenBootcamp / Linkia FP)

; Mostrar errores en pantalla (imprescindible para aprender)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Límites de memoria y tiempos de ejecución estándar
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

; Configuración de zona horaria por defecto (se suele pisar con el Dockerfile)
date.timezone = "Europe/Madrid"
