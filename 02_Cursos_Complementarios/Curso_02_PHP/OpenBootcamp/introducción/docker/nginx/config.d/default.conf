server {
    # Escuchar en el puerto 80 estándar dentro del contenedor
    listen 80;
    
    # Raíz del proyecto (si tu index.php está dentro de public/, cambia a /var/www/public)
    root /var/www;
    index index.php index.html index.htm;

    # Nombre del servidor web local
    server_name localhost;

    # Gestión de las peticiones que entran a la raíz
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesamiento de archivos .php pasando la petición al contenedor 'app'
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Denegar el acceso a archivos ocultos (como .htaccess o .git)
    location ~ /\.ht {
        deny all;
    }
}