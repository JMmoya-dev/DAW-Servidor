version: "3.8"

services:
  # Servicio de PHP
  app:
    build: 
      context: ./docker/php
      args:
        TIMEZONE: Europe/Madrid
      
    image: php_8_app
    container_name: php_8_app
    working_dir: /var/www/
    volumes:
      - ./proyect:/var/www
      - ./log/php:/srv/var/log
    networks:
      - app-network  

  # Servicio de la Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: php_8_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    env_file:
      - ./.env  
    volumes:
      - "./mysql/:/var/lib/mysql"  
    networks:
      - app-network

  # Servicio de PHPMyAdmin (Interfaz gráfica para la Base de Datos)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: php_8_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - "8080:80"   
    networks:
      - app-network

  # Servicio del Servidor Web Nginx
  nginx:
    image: nginx:alpine
    container_name: php_8_nginx
    ports:
      - "8000:80"
    volumes:
      - ./proyect:/var/www
      - ./docker/nginx/config.d:/etc/nginx/conf.d
      - ./log/nginx:/var/log/nginx
    networks:
      - app-network

# Configuración de la red interna de Docker
networks:
  app-network:
    driver: bridge