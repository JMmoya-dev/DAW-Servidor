server {
    # Escuchar en el puerto 80 estándar dentro del contenedor
    listen 80;
    
    # Raíz del proyecto y archivos de inicio válidos
    root /var/www;
    index index.php index.html index.htm;

    # Nombre del servidor web local
    server_name localhost;

    # Gestión de las peticiones que entran a la raíz
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Redirección y procesamiento de archivos .php a nuestro contenedor PHP-FPM
    location ~ \.php$ {
        # 'app' hace referencia directa al nombre de tu servicio de PHP en el docker-compose
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        
        # Mapea la ruta del archivo físico para que PHP lo localice
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Denegar el acceso a archivos ocultos de configuración del sistema (como los de Git)
    location ~ /\.ht {
        deny all;
    }
}
